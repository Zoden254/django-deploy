{% extends "master.html" %}
{% block title %}Home{% endblock title %}
{% block content %}

<h1 class="text-2xl sm:text-3xl font-bold text-center bg-fuchsia-600 text-white p-5 shadow">Guess in context</h1>

<div>
    <h2 class="text-purple-500">Choose Category</h2>
    <ul>
        {% for category in categories %}
        <li class="m-10"><a class="text-white bg-purple-400 p-3 rounded" href="{% url "guessing_app:category_questions" category %}">{{ category }}</a></li>
        {% endfor %}
    </ul>
</div>

{% endblock content %}
